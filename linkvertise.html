<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Linkvertise</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,Roboto,sans-serif}
  body{background:#0f0803;color:#fff;padding:22px 16px;min-height:100vh}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .hd h1{font-size:22px;color:#F4A950;letter-spacing:.15em;font-weight:bold}
  .hd .close{background:transparent;border:1.5px solid #F4A950;border-radius:22px;padding:10px 18px;color:#F4A950;font-size:12px;font-weight:bold;letter-spacing:.08em;width:auto;height:auto;box-shadow:none;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none}
  .hd .close:active{transform:scale(.96);background:#F4A950;color:#0f0803}
  .sub{color:#B8A088;font-size:12px;margin-top:-16px;margin-bottom:22px}
  .lbl{color:#D9C7A8;font-size:12px;font-weight:bold;margin-top:16px;margin-bottom:8px;letter-spacing:.08em}
  textarea{width:100%;background:#2A1A0E;border:1px solid #5A3D22;border-radius:14px;color:#fff;padding:14px;font-size:13px;min-height:90px;resize:none;font-family:monospace;outline:none}
  textarea::placeholder{color:#7A5A38}
  textarea:focus{border-color:#F4A950}
  .btn-main{width:100%;height:58px;background:linear-gradient(180deg,#F4A950,#C77B3F);border:none;border-radius:30px;color:#fff;font-size:15px;font-weight:bold;letter-spacing:.12em;margin-top:18px;box-shadow:0 8px 20px rgba(0,0,0,.4);cursor:pointer;-webkit-appearance:none;appearance:none;outline:none}
  .btn-main:active{transform:scale(.98)}
  .btn-main:disabled{opacity:.5}
  .status{text-align:center;color:#B8A088;font-size:12px;margin-top:16px}
  .status.ok{color:#7CF97C}
  .status.err{color:#FF6B6B}
  .log{background:#1A0F08;border:1px solid #3A2410;border-radius:14px;padding:16px;margin-top:16px;color:#F4A950;font-size:13px;word-break:break-all;font-family:monospace;line-height:1.5;user-select:all;-webkit-user-select:all;min-height:60px;white-space:pre-wrap}
  .log:empty{display:none}
</style>
</head>
<body>

<div class="hd">
  <h1>LINKVERTISE</h1>
  <button class="close" onclick="window.closeBtn&&window.closeBtn()">✕ TUTUP</button>
</div>
<div class="sub">bypass link · linkvertise.com</div>

<div class="lbl">LINK</div>
<textarea id="input" placeholder="paste link linkvertise&#10;contoh: https://linkvertise.com/123456/example"></textarea>

<button id="btn" class="btn-main">BYPASS LINK</button>

<div id="status" class="status ok">ready</div>
<div id="log" class="log"></div>

<script>
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");

function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = "status" + (cls ? " " + cls : "");
}

async function bypass(url){
  const res = await fetch("https://api.bypass.vip/", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "url=" + encodeURIComponent(url)
  });
  return await res.json();
}

async function run(){
  const url = inputEl.value.trim();
  if(!url){ setStatus("paste link dulu", "err"); return; }

  btn.disabled = true;
  btn.textContent = "PROCESSING...";
  logEl.textContent = "";
  setStatus("bypass via bypass.vip API...");

  try{
    const r = await bypass(url);
    if(r && r.status === "success" && r.result){
      setStatus("✓ LINK FOUND", "ok");
      logEl.textContent = r.result;
    } else if(r && r.status === "error"){
      setStatus("gagal: " + (r.message || "unknown"), "err");
    } else {
      setStatus("gagal — cek link atau coba lagi", "err");
      logEl.textContent = JSON.stringify(r, null, 2);
    }
  }catch(e){
    setStatus("error: " + e.message, "err");
  }

  btn.disabled = false;
  btn.textContent = "BYPASS LINK";
}

btn.addEventListener("click", run);
window.closeBtn = function(){
  if(window.AndroidBridge && window.AndroidBridge.close){
    window.AndroidBridge.close();
  } else {
    try { window.history.back(); } catch(e){}
  }
};
</script>
</body>
</html>
